server {
  listen 4173;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Resolve "server" at request time (the container DNS, see Dockerfile):
  # nginx otherwise keeps the address from its start, and every recreated
  # server container (new IP) would answer 502 until web restarts.
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
  set $api http://server:3000;

  location /api/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
